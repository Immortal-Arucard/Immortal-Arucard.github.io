<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="canonical" href="https://theworldgovernmentincorporated.com/building/">
<meta id="div-refresh" http-equiv="refresh" content="0; url=/building/">
<script>
(function () {
  var dest = '/building/' + location.search + location.hash;
  var meta = document.getElementById('div-refresh');
  if (meta) meta.setAttribute('content', '0; url=' + dest);
  var link = document.getElementById('div-link');
  if (link) link.setAttribute('href', dest);
  location.replace(dest);
})();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Building</title>
</head>
