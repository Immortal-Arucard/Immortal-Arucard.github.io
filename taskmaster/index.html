<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taskmaster has moved — The World Government, Inc.</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://taskmaster.theworldgovernmentincorporated.com/">
<script>
/* Taskmaster moved to its own app. Preserve query and hash.
   One time per browser, hand this site's local Taskmaster lists to the app
   in the URL fragment (never sent to a server). The app asks before
   importing and merges by task id. Local data here is kept, not deleted. */
(function () {
  var APP = 'https://taskmaster.theworldgovernmentincorporated.com/';
  var PREFIX = 'twgi-taskmaster-v1:';
  var DONE = 'twgi-taskmaster-v1-handoff';
  var hash = location.hash.charAt(0) === '#' ? location.hash.slice(1) : '';
  try {
    if (!localStorage.getItem(DONE)) {
      var lists = {}, n = 0;
      for (var i = 0; i < localStorage.length; i++) {
        var key = localStorage.key(i);
        if (!key || key.indexOf(PREFIX) !== 0) continue;
        var id = key.slice(PREFIX.length);
        if (!/^(device|[A-Za-z0-9-]{1,64})$/.test(id)) continue;
        var list = JSON.parse(localStorage.getItem(key) || '[]');
        if (Array.isArray(list) && list.length) { lists[id] = list; n += list.length; }
      }
      if (n) {
        var payload = 'tm-import=' + encodeURIComponent(JSON.stringify({ v: 1, lists: lists }));
        if (payload.length < 200000) {
          hash = (hash ? hash + '&' : '') + payload;
          localStorage.setItem(DONE, new Date().toISOString());
        }
      }
    }
  } catch (err) {}
  location.replace(APP + location.search + (hash ? '#' + hash : ''));
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://taskmaster.theworldgovernmentincorporated.com/"></noscript>
</head>
<body style="background:#000;color:#fff;font-family:system-ui,sans-serif;padding:24px">
<p>Taskmaster is now its own app: <a style="color:#4fc3ff" href="https://taskmaster.theworldgovernmentincorporated.com/">taskmaster.theworldgovernmentincorporated.com</a></p>
</body>
</html>
